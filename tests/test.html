<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quiet Sandbox — core tests</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; padding: 24px; color: #333; }
    .pass { color: #2f7d47; }
    .fail { color: #b23; font-weight: 700; }
    h1 { font-size: 18px; }
    li { margin: 2px 0; }
    #summary { margin-top: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>QSCore unit tests</h1>
  <ul id="out"></ul>
  <div id="summary"></div>

  <script src="../js/core.js"></script>
  <script>
    var out = document.getElementById("out");
    var pass = 0, fail = 0;

    function ok(name, cond) {
      var li = document.createElement("li");
      li.className = cond ? "pass" : "fail";
      li.textContent = (cond ? "✓ " : "✗ ") + name;
      out.appendChild(li);
      cond ? pass++ : fail++;
    }
    function near(a, b, eps) { return Math.abs(a - b) <= (eps || 1e-9); }

    var C = window.QSCore;

    // totalWeight
    ok("totalWeight([]) === 0", C.totalWeight([]) === 0);
    ok("totalWeight sums weights",
       C.totalWeight([{ weight: 1 }, { weight: 3 }, { weight: 2 }]) === 6);
    ok("totalWeight ignores missing weight",
       C.totalWeight([{ weight: 2 }, {}]) === 2);

    // computeTilt: convention positive = right side down
    ok("balanced -> 0 tilt", C.computeTilt(0, 0) === 0);
    ok("balanced equal weights -> 0", C.computeTilt(4, 4) === 0);
    ok("heavier right -> positive tilt", C.computeTilt(1, 3) > 0);
    ok("heavier left -> negative tilt", C.computeTilt(3, 1) < 0);
    ok("tilt is symmetric",
       near(C.computeTilt(1, 3), -C.computeTilt(3, 1)));
    ok("tilt clamps to max on huge difference",
       near(C.computeTilt(0, 1000), 0.22) && near(C.computeTilt(1000, 0), -0.22));
    ok("small difference stays within max",
       Math.abs(C.computeTilt(1, 2)) <= 0.22);

    // deflect: a particle should be pushed away from an obstacle it overlaps
    (function () {
      var obs = [{ x: 100, y: 100, r: 20 }];
      // particle just left of the obstacle center, drifting down
      var r = C.deflect(90, 100, 0, 1, obs, 26);
      ok("deflect pushes particle left-ward away from obstacle", r.vx < 0);
      // particle far away is unaffected
      var far = C.deflect(400, 400, 0, 1, obs, 26);
      ok("deflect leaves distant particle unchanged",
         far.vx === 0 && far.vy === 1);
    })();

    document.getElementById("summary").innerHTML =
      fail === 0
        ? '<span class="pass">All ' + pass + ' tests passed.</span>'
        : '<span class="fail">' + fail + " failed</span>, " + pass + " passed.";
    window.__RESULT__ = { pass: pass, fail: fail };
  </script>
</body>
</html>
