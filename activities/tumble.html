<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>The Pebble Path</title>
  <link rel="icon" type="image/png" href="../assets/logo.png" />
  <link rel="apple-touch-icon" href="../assets/logo.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .controls {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .pill {
      border: none;
      cursor: pointer;
      padding: 13px 22px;
      border-radius: 999px;
      background: rgba(255,255,255,0.55);
      color: var(--ink-soft);
      font: 600 16px/1 var(--font);
      letter-spacing: 0.02em;
      box-shadow: 0 3px 12px rgba(74,68,59,0.12);
      transition: transform var(--slow) var(--ease), background var(--slow) var(--ease);
    }
    .pill:hover  { background: rgba(255,255,255,0.75); }
    .pill:active { transform: scale(0.96); }
    .pill.primary { background: var(--forest-soft); color: #fff; }
    .pill.primary:hover { background: var(--forest); }
    .prompt {
      position: fixed;
      left: 0; right: 0;
      bottom: 78px;
      text-align: center;
      z-index: 9;
      color: var(--ink-soft);
      font: 500 clamp(15px,2.2vw,18px)/1.3 var(--font);
      opacity: 0.9;
      pointer-events: none;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <div class="screen" id="screen">
    <canvas class="stage" id="stage"></canvas>
  </div>

  <div class="corner left" id="corner-left"></div>
  <div class="corner right" id="corner-right"></div>

  <div class="prompt" id="prompt"></div>
  <div class="controls">
    <button class="pill primary" id="drop" type="button">Drop the pebble</button>
    <button class="pill" id="reset" type="button">Reset ramps</button>
    <button class="pill" id="mode" type="button">1 2 3</button>
  </div>

  <script src="../js/palette.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/audio.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/tumble.js"></script>
</body>
</html>
